<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生词本</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F9F9F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)">
<style>
:root {
  --ground:      #F9F9F9;
  --surface:     #FFFFFF;
  --surface-sub: #F1F1F0;
  --border:      #E6E5E4;
  --border-firm: #CFCECC;
  --text:        #111213;
  --text-sub:    #2C3033;
  --text-mute:   #4F5359;
  --brand:       #45BFDB;
  --brand-text:  #252A4D;
  --brand-deep:  #205B5C;
  --on-brand:    #111213;
  --warn:        #6B2827;
  --warn-bg:     #F7EFEE;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #111213;
    --surface:     #1A1C1F;
    --surface-sub: #232629;
    --border:      #2A2D31;
    --border-firm: #3A3E43;
    --text:        #E6E5E4;
    --text-sub:    #C3C6C9;
    --text-mute:   #8E959D;
    --brand:       #45BFDB;
    --brand-text:  #6DD9F2;
    --brand-deep:  #99ECFF;
    --on-brand:    #111213;
    --warn:        #E8A29A;
    --warn-bg:     #241A19;
  }
}
:root[data-theme="dark"] {
  --ground:      #111213;
  --surface:     #1A1C1F;
  --surface-sub: #232629;
  --border:      #2A2D31;
  --border-firm: #3A3E43;
  --text:        #E6E5E4;
  --text-sub:    #C3C6C9;
  --text-mute:   #8E959D;
  --brand:       #45BFDB;
  --brand-text:  #6DD9F2;
  --brand-deep:  #99ECFF;
  --on-brand:    #111213;
  --warn:        #E8A29A;
  --warn-bg:     #241A19;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--ground);
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.75;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-deep); outline-offset: 2px; }

.page { max-width: 720px; margin: 0 auto; padding: 20px 16px 120px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 24px; font-weight: 600; color: var(--brand-text); text-wrap: balance; }
.meta { font-size: 12px; color: var(--text-mute); font-variant-numeric: tabular-nums; }

.toolbar { display: flex; flex-direction: column; gap: 10px; }
.search {
  width: 100%; padding: 9px 12px; font-size: 15px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
}
.search::placeholder { color: var(--text-mute); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 4px 12px; font-size: 13.5px; border-radius: 999px;
  background: var(--surface-sub); color: var(--text-sub);
  border: 1px solid var(--border);
}
.chip[aria-pressed="true"] { background: var(--brand-text); color: var(--surface); border-color: var(--brand-text); }

.list { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; width: 100%; text-align: left; }
.pick { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-firm); display: grid; place-items: center; font-size: 13px; color: transparent; }
.card.picked .pick { background: var(--brand-deep); border-color: var(--brand-deep); color: #fff; }
.head-main { flex: 1; min-width: 0; }
.expr { font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
.gloss { font-size: 13.5px; color: var(--text-sub); overflow-wrap: anywhere; }
.badge { flex: none; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface-sub); color: var(--text-mute); letter-spacing: .04em; }
.badge.want { color: var(--brand-deep); }
.detail { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
.card.open .detail { display: block; }
.dl { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; font-size: 13.5px; color: var(--text-sub); }
.dl b { color: var(--text-mute); font-weight: 500; font-size: 12px; letter-spacing: .08em; }
.dl p { overflow-wrap: anywhere; }
.empty { padding: 40px 0; text-align: center; color: var(--text-mute); font-size: 13.5px; }

.practice-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  display: none;
}
.practice-bar.show { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 720px; margin: 0 auto; }
.practice-bar .cnt { font-size: 13.5px; color: var(--text-sub); }
.btn {
  padding: 9px 20px; border-radius: 10px; font-weight: 600; font-size: 15px;
  background: var(--brand-text); color: var(--surface);
}

.overlay {
  position: fixed; inset: 0; z-index: 30; display: none;
  background: var(--ground);
  flex-direction: column;
}
.overlay.show { display: flex; }
.ov-top { padding: 16px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
.ov-title { font-size: 16px; font-weight: 600; color: var(--brand-text); }
.ov-chunks { display: flex; gap: 6px; flex-wrap: wrap; }
.ov-chunk { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--surface-sub); color: var(--text-sub); border: 1px solid var(--border); }
.subs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.line { font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.line .who { font-size: 11px; letter-spacing: .08em; color: var(--text-mute); display: block; }
.line.coach .txt { color: var(--text); }
.line.me .txt { color: var(--text-sub); }
.status { padding: 0 16px 8px; font-size: 13.5px; color: var(--text-mute); }
.status.err { color: var(--warn); }
.ov-bottom {
  padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.talk {
  width: 96px; height: 96px; border-radius: 50%;
  background: var(--brand); color: var(--on-brand);
  font-size: 15px; font-weight: 700;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.talk { position: relative; }
.talk.listening { filter: brightness(1.12); transform: scale(1.06); }
.talk.listening::after {
  content: ''; position: absolute; inset: -8px; border-radius: 50%;
  border: 3px solid var(--brand); pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) {
  .talk.listening::after { animation: ripple 1.2s ease-out infinite; }
}
@keyframes ripple {
  0% { transform: scale(0.95); opacity: .9; }
  100% { transform: scale(1.4); opacity: 0; }
}
.end-btn { font-size: 13.5px; color: var(--text-mute); text-decoration: underline; }

@media (prefers-reduced-motion: no-preference) {
  .talk { transition: transform .12s ease, filter .12s ease; }
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="top">
    <h1>生词本</h1>
    <span class="meta" id="meta"></span>
  </div>
  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="搜索表达 / 释义 / 例句" autocomplete="off">
    <div class="chips" id="statusChips"></div>
    <div class="chips" id="tagChips"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>没有匹配的表达</div>
</div>

<div class="practice-bar" id="practiceBar">
  <span class="cnt" id="pickCnt"></span>
  <button class="btn" id="startBtn">开始练习</button>
</div>

<div class="overlay" id="overlay">
  <div class="ov-top">
    <div class="ov-title">口语练习</div>
    <div class="ov-chunks" id="ovChunks"></div>
  </div>
  <div class="subs" id="subs"></div>
  <div class="status" id="status">连接中…</div>
  <div class="ov-bottom">
    <button class="talk" id="talk" disabled>按住<br>说话</button>
    <button class="end-btn" id="endBtn">结束练习</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
