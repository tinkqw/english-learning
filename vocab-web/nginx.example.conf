# 生词本网页 nginx 配置（与实际在用的配置一致，只换了域名）。
# 把 vocab.example.com 换成你的域名；证书段由 certbot --nginx 写入。
server {
    listen 80;
    server_name vocab.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vocab.example.com;
    ssl_certificate /etc/letsencrypt/live/vocab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vocab.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vocab;

    # 登录页与登录接口不需要 Cookie
    location = /login.html {
        try_files $uri =404;
    }

    location = /login {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    # nginx auth_request 子请求：只校验 Cookie
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8787;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # 语音 WebSocket
    location /ws {
        auth_request /_auth;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余（页面、data.json）一律先验 Cookie，未登录跳登录页
    location / {
        auth_request /_auth;
        error_page 401 = @login;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location @login {
        return 302 /login.html;
    }
}
